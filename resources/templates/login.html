<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login to Sanccce Weather Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="login-card text-center">
          <p>Enter credentials to access Sanccce Weather Tracker</p>

          <!--- Login form --->
          <form th:action="@{/login}" method="POST">

            <!--- in case of error --->
            <div th:if="${param.error}" class="alert alert-danger mt-3">
              Invalid username or password!
            </div>

            <!--- in case of logout --->
            <div th:if="${param.logout}" class="alert alert-info mt-3">
              You have been logged out.
            </div>

            <!-- User name ----->
            <div class="mb-3">
              <input type="text" name="username" class="form-control form-control-lg"
              placeholder="Username" required autofocus/>
            </div>

            <!--- User password --->
            <div class="mb-3">
              <input type="password" name="password" class="form-control form-control-lg"
              placeholder="Password" required/>
            </div>

            <!---- login button --->
            <button class="btn btn-success btn-lg w-100 btn-login">
              <i class="bi bi-box-arrow-in-right">
                Login
              </i>
            </button>
          </form>

          <!---- path to register form if user does not have account --->
          <p><a th:href="@{/register}">Don't have an account? Register</a></p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

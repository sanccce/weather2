<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Register page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />
  <link rel="stylesheet" href="/style2.css" />
</head>
<body>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card text-center">
        <h1>Registration</h1>
        <p>Create your Sanccce Weather Account</p>

        <!--- the register form --->
        <form th:action="@{/processRegister}" th:object="${user}" method="POST">

          <div class="mb-3">
            <input type="text" th:field="*{username}" class="form-control form-control-lg"
                   placeholder="Username" required />
          </div>
          <div class="mb-3">
            <input type="password" th:field="*{password}" class="form-control form-control-lg"
                   placeholder="Password" required/>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100 btn-register">
            <i class="bi bi-check-circle"></i>
            Register
          </button>
        </form>

        <div th:if="${error}" class="alert alert-danger mt-3"
        th:text="${error}"></div>

        <div th:if="${success}" class="alert alert-success mt-3"
        th:text="${success}"></div>
        <hr class="text-light">
        <p><a th:href="@{/login}">Already have an account? Login</a></p>
      </div>
    </div>
  </div>
</div>

</body>
</html>
